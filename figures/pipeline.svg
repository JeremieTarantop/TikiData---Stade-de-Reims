<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1d">From raw match data to tactical patterns</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">End to end pipeline, iterated weekly with club analysts</text>

  <!-- Step 1: Data sources -->
  <rect x="40" y="110" width="160" height="180" rx="14" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="120" y="135" text-anchor="middle" font-size="11" fill="#666" font-weight="600" letter-spacing="1.5">INPUT</text>
  <text x="120" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1d">Match data</text>
  <line x1="60" y1="175" x2="180" y2="175" stroke="#d4d4d8" stroke-width="1"/>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#333">Tracking data</text>
  <text x="120" y="217" text-anchor="middle" font-size="10" fill="#888">Player + ball XY at high freq</text>
  <text x="120" y="247" text-anchor="middle" font-size="12" fill="#333">Event data</text>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#888">Passes, runs, dribbles</text>

  <!-- Step 2: Feature engineering -->
  <rect x="240" y="110" width="160" height="180" rx="14" fill="#fff5f6" stroke="#cc1f2f" stroke-width="1.5"/>
  <text x="320" y="135" text-anchor="middle" font-size="11" fill="#cc1f2f" font-weight="600" letter-spacing="1.5">STEP 1</text>
  <text x="320" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1d">Feature engineering</text>
  <line x1="260" y1="175" x2="380" y2="175" stroke="#fdd" stroke-width="1"/>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#333">Transition speed</text>
  <text x="320" y="216" text-anchor="middle" font-size="11" fill="#333">Verticality</text>
  <text x="320" y="234" text-anchor="middle" font-size="11" fill="#333">Defensive block height</text>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#333">Attackers vs defenders</text>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#333">Recovery zone</text>

  <!-- Step 3: Clustering -->
  <rect x="440" y="110" width="160" height="180" rx="14" fill="#fff5f6" stroke="#cc1f2f" stroke-width="1.5"/>
  <text x="520" y="135" text-anchor="middle" font-size="11" fill="#cc1f2f" font-weight="600" letter-spacing="1.5">STEP 2</text>
  <text x="520" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1d">Clustering</text>
  <line x1="460" y1="175" x2="580" y2="175" stroke="#fdd" stroke-width="1"/>
  <text x="520" y="200" text-anchor="middle" font-size="12" fill="#333">Split by recovery zone</text>
  <text x="520" y="218" text-anchor="middle" font-size="10" fill="#888">low / mid / high</text>
  <text x="520" y="247" text-anchor="middle" font-size="12" fill="#333">Cluster within zones</text>
  <text x="520" y="265" text-anchor="middle" font-size="10" fill="#888">interpretable sub patterns</text>

  <!-- Step 4: Validation + Classification -->
  <rect x="640" y="110" width="160" height="180" rx="14" fill="#fff5f6" stroke="#cc1f2f" stroke-width="1.5"/>
  <text x="720" y="135" text-anchor="middle" font-size="11" fill="#cc1f2f" font-weight="600" letter-spacing="1.5">STEP 3</text>
  <text x="720" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1d">Validate + classify</text>
  <line x1="660" y1="175" x2="780" y2="175" stroke="#fdd" stroke-width="1"/>
  <text x="720" y="198" text-anchor="middle" font-size="12" fill="#333">Expert review with</text>
  <text x="720" y="215" text-anchor="middle" font-size="12" fill="#333">club analysts</text>
  <text x="720" y="245" text-anchor="middle" font-size="12" fill="#333">3 Random Forests,</text>
  <text x="720" y="262" text-anchor="middle" font-size="12" fill="#333">one per zone</text>

  <!-- Arrows between steps -->
  <line x1="200" y1="200" x2="240" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="200" x2="440" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="200" x2="640" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output banner -->
  <rect x="40" y="330" width="760" height="60" rx="14" fill="#1a1a1d"/>
  <text x="60" y="358" font-size="11" fill="#9f1320" font-weight="600" letter-spacing="1.5">OUTPUT</text>
  <text x="60" y="378" font-size="14" fill="#fff" font-weight="600">16 categories of offensive transitions, 87% classification accuracy, validated by club analysts</text>

  <line x1="120" y1="290" x2="120" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="290" x2="720" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
</svg>
